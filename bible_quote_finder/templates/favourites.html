{% extends "base.html" %}
{% block content %}
<h4>My Favourites</h4>
<div>
    {% if favourites %}
    {% for fav in favourites %}
        <div class="card mb-3 border-success-subtle">
        <div class="card-body d-flex justify-content-between align-items-start">
            <div>
            <h6 class="card-subtitle mb-2 text-muted">{{ fav.reference }}</h6>
            <p class="card-text mb-1">{{ fav.text }}</p>
            <span class="badge bg-secondary">{{ fav.topic }}</span>
            </div>
            <form action="/favourites/delete/{{ fav.id }}" method="post" class="ms-3">
            <input type="hidden" name="keyword" value="{{ keyword }}">
            <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
            </form>
        </div>
        </div>
    {% endfor %}
    {% else %}
    <p class="text-muted">No favourites saved yet.</p>
    {% endif %}
</div>
<div class="d-flex justify-content-center">
    <a href="/" class="btn btn-primary">Go Back</a>
</div>
{% endblock %}
